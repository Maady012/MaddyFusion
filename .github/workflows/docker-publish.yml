name: Build & Push MaddyFusion Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish to GHCR
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Build frontend
        run: |
          cd clients/frontend
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build Rust binaries
        env:
          SQLX_OFFLINE: "true"
        run: |
          cd backend
          cargo build --release --features tls-native,embed-frontend --target x86_64-unknown-linux-gnu --bin mediafusion-api
          cargo build --release --features tls-native,nsfw-classifier --target x86_64-unknown-linux-gnu --bin mediafusion-worker
          mkdir -p ../rust-dist/amd64
          cp target/x86_64-unknown-linux-gnu/release/mediafusion-api ../rust-dist/amd64/mediafusion-api
          cp target/x86_64-unknown-linux-gnu/release/mediafusion-worker ../rust-dist/amd64/mediafusion-worker
          cd ..

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repo Name for Image Tag
        id: image_name
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          echo "image=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          build-args: |
            TARGETARCH=amd64
            VERSION=6.2.0-maddy
          tags: |
            ${{ steps.image_name.outputs.image }}:latest
            ${{ steps.image_name.outputs.image }}:main
