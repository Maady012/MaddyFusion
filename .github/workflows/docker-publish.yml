name: Build & Push MaddyFusion Image

on:
  push:
    branches:
      - custom-prod
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build Rust release binary
        run: |
          cd backend
          cargo build --release --bin mediafusion-api
          mkdir -p ../rust-dist/amd64
          cp target/release/mediafusion-api ../rust-dist/amd64/mediafusion-api
          # Worker placeholder to satisfy multi-binary Dockerfile
          cp target/release/mediafusion-api ../rust-dist/amd64/mediafusion-worker
          cd ..

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repo Name for Image Tag
        id: image_name
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          echo "image=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          build-args: |
            TARGETARCH=amd64
            VERSION=6.2.0-maddy
          tags: |
            ${{ steps.image_name.outputs.image }}:latest
            ${{ steps.image_name.outputs.image }}:custom-prod
